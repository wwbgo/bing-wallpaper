name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "."

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binaries
        run: cargo build --release --bins --locked

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$version installer\bing-wallpaper.iss

      - name: Package release assets
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $version = $tag -replace '^v', ''
          $stage = "dist/bing-wallpaper-windows-x64"
          $zip = "bing-wallpaper-windows-x64-$tag.zip"
          $installer = "dist/BingWallpaperSetup-$version.exe"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/bing-wallpaper.exe" $stage
          Copy-Item "target/release/bing-wallpaper-worker.exe" $stage
          Copy-Item "README.md" $stage

          Compress-Archive -Path "$stage/*" -DestinationPath $zip

          foreach ($asset in @($zip, $installer)) {
            $hash = Get-FileHash $asset -Algorithm SHA256
            "$($hash.Hash.ToLower())  $asset" | Out-File -Encoding ascii "$asset.sha256"
          }

          Get-ChildItem $zip, "$zip.sha256", $installer, "$installer.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bing-wallpaper-windows-x64
          path: |
            bing-wallpaper-windows-x64-*.zip
            bing-wallpaper-windows-x64-*.zip.sha256
            dist/BingWallpaperSetup-*.exe
            dist/BingWallpaperSetup-*.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            bing-wallpaper-windows-x64-*.zip
            bing-wallpaper-windows-x64-*.zip.sha256
            dist/BingWallpaperSetup-*.exe
            dist/BingWallpaperSetup-*.exe.sha256
          generate_release_notes: true
